[project]
name = "scribworker"
version = "0.2.0"
description = "ScribBot transcription worker: Cactus Compute's Whistle speech-to-text behind a small HTTP API"
requires-python = ">=3.10"
dependencies = [
    "cactus-needle>=3.2.8",
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
scribworker = "scribworker.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scribworker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
